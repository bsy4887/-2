name: Alarm
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Alarm:
    type: application
    platform: iOS
    sources: [AlarmApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarm
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 알람
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
