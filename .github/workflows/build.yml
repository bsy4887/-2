{
"name": "Build IPA",
"on": {"workflow_dispatch": {}, "push": {"branches": ["main"]}},
"jobs": {"build": {"runs-on": "macos-15", "steps": [
{"uses": "actions/checkout@v4"},
{"name": "Generate", "run": "brew install xcodegen\nxcodegen generate"},
{"name": "Build", "run": "xcodebuild -project Alarm.xcodeproj -scheme Alarm -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=\"\" build"},
{"name": "Package", "run": "mkdir Payload\ncp -R build/Build/Products/Release-iphoneos/Alarm.app Payload/\nzip -r Alarm.ipa Payload"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "Alarm-ipa", "path": "Alarm.ipa"}}
]}}
}
